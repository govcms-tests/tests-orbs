description: >
  CI setup for GovCMS using PHPUnit.

executor:
  name: default

working_directory: /app

steps:
  - run:
      name: Clean Working Directory
      command: find /app -mindepth 1 -delete
  - checkout
  - run:
      name: Install GovCMS Dependencies
      command: composer update --profile --prefer-dist --optimize-autoloader
  - run:
      name: Set up the PHPUnit tests
      command: git clone --depth 1 -b 3.x-develop https://github.com/govcms-tests/tests.git /app/tests
  - run:
      name: Run PHPUnit tests
      command: phpunit --bootstrap /app/tests/phpunit/bootstrap.php --configuration /app/tests/phpunit/phpunit.xml --testdox --testsuite govcms-integration
