description: |
  CI setup for GovCMS using Cypress.

executor:
  name: default

working_directory: /app

steps:
  - run:
      name: Clean Working Directory
      command: find /app -mindepth 1 -delete
  - checkout
  - run:
      name: Install GovCMS dependencies
      command: composer update --profile --prefer-dist --optimize-autoloader
  - run:
      name: Install GovCMS site
      command: >
        drush si -y govcms
        --db-url=sqlite://sites/default/files/.ht.sqlite
        --site-name='GovCMS'
        --account-pass=password
        install_configure_form.enable_update_status_emails=NULL
        install_configure_form.enable_update_status_module=NULL || true

        chmod 755 /app/web/sites/default

        sed -i '$ a\$settings['"'"'file_private_path'"'"'] = '"'"'/app/web/sites/default/files/private'"'"';' /app/web/sites/default/settings.php
  - run:
      name: Install Cypress Dependencies
      command: |
        composer create-project govcms/tests:4.x-dev tests
        cd tests/cy && npm ci
  - run:
      name: Run Cypress tests
      command: |
        cd tests/cy && npx cypress run --config baseUrl=http://localhost
  - store_artifacts:
      path: tests/cy/cypress/videos
  - store_artifacts:
      path: tests/cy/cypress/screenshots
