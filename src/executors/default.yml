description: >
  GovCMS tests default executor with dynamic PHP version support.
docker:
  - image: 'govcmstesting/ci:<<parameters.php_version>>'
    command: ["apache2-foreground"]
parameters:
  php_version:
    default: "php8.3-apache-sqlite-3.45"
    description: >
      The version of PHP to use.
    type: string
